name: Atlas Realms CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate strategic web app
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html app.js strategy-mode.js strategy-enhancements.js styles.css config.js tests/smoke.mjs; do
            test -f "$file"
          done

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check strategy-mode.js
          node --check strategy-enhancements.js
          node --check config.js
          node --check tests/smoke.mjs

      - name: Validate HTML asset references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'href="styles.css"' index.html
          grep -q 'src="config.js"' index.html
          grep -q 'src="app.js"' index.html
          grep -q 'src="strategy-mode.js"' index.html
          grep -q 'src="strategy-enhancements.js"' index.html

      - name: Scan for obvious broken merge markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            echo 'Merge-conflict markers found.'
            exit 1
          fi

      - name: Install browser test runner
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Run independent browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          node tests/smoke.mjs
